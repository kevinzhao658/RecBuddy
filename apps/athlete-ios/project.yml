name: RecBuddy
options:
  bundleIdPrefix: app.recbuddy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configFiles:
  Debug: Config.dev.xcconfig    # Simulator / "RecBuddy Dev" scheme -> dev Supabase
  Release: Config.prod.xcconfig # Device / "RecBuddy Prod" scheme -> prod Supabase
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  RecBuddy:
    type: application
    platform: iOS
    sources: [RecBuddy]
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: RecBuddy/Info.plist
      properties:
        CFBundleDisplayName: RecBuddy
        UILaunchScreen: {}
        UIAppFonts: [SairaCondensed-ExtraBold.ttf]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ResetPasswordRedirect: $(RESET_PASSWORD_REDIRECT)
        EmailConfirmRedirect: $(EMAIL_CONFIRM_REDIRECT)
        CFBundleURLTypes:
          - CFBundleURLName: app.recbuddy.athlete
            CFBundleURLSchemes: [recbuddy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.recbuddy.athlete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — no iPad layouts
  RecBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecBuddyTests]
    dependencies:
      - target: RecBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  RecBuddy Dev:
    build:
      targets:
        RecBuddy: all
        RecBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RecBuddyTests]
  RecBuddy Prod:
    build:
      targets:
        RecBuddy: all
    run:
      config: Release
