name: RecBuddy
options:
  bundleIdPrefix: app.recbuddy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configFiles:
  Debug: Config.dev.xcconfig    # Simulator / "RecBuddy Dev" scheme -> dev Supabase
  Release: Config.prod.xcconfig # Device / "RecBuddy Prod" scheme -> prod Supabase
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  RecBuddy:
    type: application
    platform: iOS
    sources: [RecBuddy]
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: RecBuddy/Info.plist
      properties:
        CFBundleDisplayName: RecBuddy
        UILaunchScreen: {}
        UIAppFonts: [SairaCondensed-ExtraBold.ttf]
        # Standard HTTPS/Supabase traffic is exempt encryption. Setting this to
        # NO skips the export-compliance question on every App Store upload.
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ResetPasswordRedirect: $(RESET_PASSWORD_REDIRECT)
        EmailConfirmRedirect: $(EMAIL_CONFIRM_REDIRECT)
        NSHealthShareUsageDescription: RecBuddy reads your recorded runs and rides to automatically log completed workouts against your training plan.
        CFBundleURLTypes:
          - CFBundleURLName: app.recbuddy.athlete
            CFBundleURLSchemes: [recbuddy]
    entitlements:
      path: RecBuddy/RecBuddy.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.recbuddy.athlete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — no iPad layouts
        # Paid Apple Developer team (Kevin Zhao). Lives here — not in Xcode's
        # UI — because the .xcodeproj is regenerated by XcodeGen and a team
        # picked by hand would be wiped on every regen. Team IDs aren't secret.
        DEVELOPMENT_TEAM: R2D2PYP37U
  RecBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecBuddyTests]
    dependencies:
      - target: RecBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  RecBuddy Dev:
    build:
      targets:
        RecBuddy: all
        RecBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RecBuddyTests]
  RecBuddy Prod:
    build:
      targets:
        RecBuddy: all
    run:
      config: Release
