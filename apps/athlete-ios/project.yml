name: RecBuddy
options:
  bundleIdPrefix: app.recbuddy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configFiles:
  Debug: Config.dev.xcconfig    # Simulator / "RecBuddy Dev" scheme -> dev Supabase
  Release: Config.prod.xcconfig # Device / "RecBuddy Prod" scheme -> prod Supabase
# One place for the app version. Bump CURRENT_PROJECT_VERSION for every App
# Store Connect upload (Apple rejects a reused build number); both Info.plists
# read these, so the widget extension always matches the app.
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  RecBuddy:
    type: application
    platform: iOS
    sources: [RecBuddy]
    dependencies:
      - package: Supabase
        product: Supabase
      - target: RecBuddyWidgets
    info:
      path: RecBuddy/Info.plist
      properties:
        CFBundleDisplayName: RecBuddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Still frame before the app runs; SplashView animates from this exact frame.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchWordmark
          UIImageRespectsSafeAreaInsets: false
        UIAppFonts: [SairaCondensed-ExtraBold.ttf]
        # Standard HTTPS/Supabase traffic is exempt encryption. Setting this to
        # NO skips the export-compliance question on every App Store upload.
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ResetPasswordRedirect: $(RESET_PASSWORD_REDIRECT)
        EmailConfirmRedirect: $(EMAIL_CONFIRM_REDIRECT)
        NSHealthShareUsageDescription: RecBuddy reads your recorded runs and rides to automatically log completed workouts against your training plan.
        # Required by App Store validation whenever the HealthKit entitlement is
        # present, even though RecBuddy only reads (toShare: []) — never shown.
        NSHealthUpdateUsageDescription: RecBuddy does not write data to Apple Health. It only reads your recorded runs and rides to log completed workouts against your training plan.
        CFBundleURLTypes:
          - CFBundleURLName: app.recbuddy.athlete
            CFBundleURLSchemes: [recbuddy]
    preBuildScripts:
      # Fail the build, not the app, when the Supabase config is missing.
      # Without it Supa.swift crashes at launch, which App Review rejects.
      - name: Check Supabase config
        basedOnDependencyAnalysis: false
        script: |
          case "${SUPABASE_URL}|${SUPABASE_ANON_KEY}" in
            "|"*|*"|"|*"<"*)
              echo "error: SUPABASE_URL / SUPABASE_ANON_KEY are missing or still placeholders. Copy Config.example.xcconfig to Config.dev.xcconfig / Config.prod.xcconfig and fill them in."
              exit 1 ;;
          esac
          case "${SUPABASE_URL}" in
            https://*) ;;
            *) if [ "${CONFIGURATION}" = "Release" ]; then
                 echo "error: Release builds must point SUPABASE_URL at an https host (got ${SUPABASE_URL})."
                 exit 1
               fi ;;
          esac
    entitlements:
      path: RecBuddy/RecBuddy.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.app.recbuddy.athlete]
        # Leave this as development. Xcode swaps in the distribution profile's
        # value (production) when it exports an App Store or TestFlight build,
        # and PushRegistrar reads the env from the embedded profile at runtime.
        # Setting production here breaks dev-profile installs from Xcode.
        # Check after each export:
        #   codesign -d --entitlements - <exported .app> | grep -A1 aps-environment
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.recbuddy.athlete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — no iPad layouts
        # Paid Apple Developer team (Kevin Zhao). Lives here — not in Xcode's
        # UI — because the .xcodeproj is regenerated by XcodeGen and a team
        # picked by hand would be wiped on every regen. Team IDs aren't secret.
        DEVELOPMENT_TEAM: R2D2PYP37U
  RecBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecBuddyTests]
    dependencies:
      - target: RecBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
  RecBuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - RecBuddyWidgets
      - RecBuddy/Lib/TodaySnapshot.swift
    info:
      path: RecBuddyWidgets/Info.plist
      properties:
        CFBundleDisplayName: RecBuddy Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RecBuddyWidgets/RecBuddyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.recbuddy.athlete]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.recbuddy.athlete.widgets
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: R2D2PYP37U
        SKIP_INSTALL: YES
schemes:
  RecBuddy Dev:
    build:
      targets:
        RecBuddy: all
        RecBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RecBuddyTests]
  RecBuddy Prod:
    build:
      targets:
        RecBuddy: all
    run:
      config: Release
